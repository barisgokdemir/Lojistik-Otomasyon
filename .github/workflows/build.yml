name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Derleme (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Lojistik.sln

      - name: Build
        run: dotnet build Lojistik.sln -c Release --no-restore

      - name: Publish (win-x64, tek dosya)
        run: >
          dotnet publish src/Lojistik/Lojistik.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true -o publish

      - name: Paketle
        shell: pwsh
        run: |
          Copy-Item -Recurse database publish/database
          Compress-Archive -Path publish/* -DestinationPath Lojistik-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lojistik-win-x64
          path: Lojistik-win-x64.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Lojistik-win-x64.zip
          generate_release_notes: true

  database:
    name: SQL scriptleri (SQL Server 2022)
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Test_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci_Test_Passw0rd!' -C -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Scriptleri container'a kopyala
        run: docker cp database ${{ job.services.mssql.id }}:/tmp/database

      - name: Şema ve örnek veriler (iki kez, tekrar çalıştırılabilirlik testi)
        run: |
          for i in 1 2; do
            for f in 01_schema.sql 02_seed.sql; do
              docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd \
                -S localhost -U sa -P 'Ci_Test_Passw0rd!' -C -b -i /tmp/database/$f
            done
          done

      - name: Kontrol sorgusu
        run: |
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'Ci_Test_Passw0rd!' -C -b -d Lojistik -Q "
              SET NOCOUNT ON;
              SELECT s.SevkiyatAdi, u.UrunAdi, t.FirmaAdi
              FROM dbo.Sevkiyatlar s
              JOIN dbo.Urunler u ON u.UrunID = s.UrunID
              JOIN dbo.TasiyiciFirmalar t ON t.TasiyiciFirmaID = s.TasiyiciFirmaID;
              IF (SELECT COUNT(*) FROM dbo.Sevkiyatlar) <> 3 THROW 50000, 'Beklenmeyen kayıt sayısı', 1;"
